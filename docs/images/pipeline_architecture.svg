<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Stillpress Four-Step Anti-Doomscroll Pipeline Architecture">
  <rect width="1200" height="420" fill="#F6F6F4"/>
  <rect x="24" y="24" width="1152" height="372" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="56" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#0F172A">Stillpress Four-Step Anti-Doomscroll Pipeline</text>
  <text x="56" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Server-side API key isolation, Mozilla Readability extraction, Gemini Search Grounding, and multi-channel calm delivery</text>

  <line x1="56" y1="118" x2="1144" y2="118" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="56" y="144" width="240" height="216" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="76" y="176" font-family="monospace" font-size="12" font-weight="700" fill="#1E3A8A">01 · EXTRACTION</text>
  <text x="76" y="206" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#0F172A">Clean Article Prose</text>
  <text x="76" y="236" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• @mozilla/readability + jsdom</text>
  <text x="76" y="258" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• SSRF private-IP blocking</text>
  <text x="76" y="280" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• Live RSS Wire (rss-parser)</text>
  <text x="76" y="302" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• Browser-tab MV3 fallback</text>
  <text x="76" y="340" font-family="monospace" font-size="11" fill="#64748B">POST /api/extract</text>

  <!-- Arrow 1 -->
  <line x1="304" y1="252" x2="334" y2="252" stroke="#1E3A8A" stroke-width="2"/>
  <polygon points="334,247 344,252 334,257" fill="#1E3A8A"/>

  <!-- Step 2 -->
  <rect x="348" y="144" width="240" height="216" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="368" y="176" font-family="monospace" font-size="12" font-weight="700" fill="#1E3A8A">02 · VERIFICATION</text>
  <text x="368" y="206" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#0F172A">Cross-Source Search</text>
  <text x="368" y="236" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• Gemini googleSearch tool</text>
  <text x="368" y="258" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• Finds 2–3 independent reports</text>
  <text x="368" y="280" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• Extracts groundingChunks URLs</text>
  <text x="368" y="302" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• Surfaces omitted context</text>
  <text x="368" y="340" font-family="monospace" font-size="11" fill="#64748B">gemini-4-hydrogen</text>

  <!-- Arrow 2 -->
  <line x1="596" y1="252" x2="626" y2="252" stroke="#1E3A8A" stroke-width="2"/>
  <polygon points="626,247 636,252 626,257" fill="#1E3A8A"/>

  <!-- Step 3 -->
  <rect x="640" y="144" width="240" height="216" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="660" y="176" font-family="monospace" font-size="12" font-weight="700" fill="#1E3A8A">03 · NEUTRALIZATION</text>
  <text x="660" y="206" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#0F172A">Facts &amp; Context</text>
  <text x="660" y="236" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• Strict responseSchema JSON</text>
  <text x="660" y="258" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• Verified Facts vs. Opinions</text>
  <text x="660" y="280" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• 2–3 sentence historical note</text>
  <text x="660" y="302" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569">• SHA-256 disk-backed cache</text>
  <text x="660" y="340" font-family="monospace" font-size="11" fill="#64748B">.cache/syntheses.json</text>

  <!-- Arrow 3 -->
  <line x1="888" y1="252" x2="918" y2="252" stroke="#1E3A8A" stroke-width="2"/>
  <polygon points="918,247 928,252 918,257" fill="#1E3A8A"/>

  <!-- Step 4 -->
  <rect x="932" y="144" width="212" height="216" rx="10" fill="#1E3A8A"/>
  <text x="952" y="176" font-family="monospace" font-size="12" font-weight="700" fill="#BFDBFE">04 · CALM DELIVERY</text>
  <text x="952" y="206" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">Three Channels</text>
  <text x="952" y="236" font-family="system-ui, sans-serif" font-size="12.5" fill="#E2E8F0">• Broadsheet Web Reader</text>
  <text x="952" y="258" font-family="system-ui, sans-serif" font-size="12.5" fill="#E2E8F0">• Once-a-Day Email Digest</text>
  <text x="952" y="280" font-family="system-ui, sans-serif" font-size="12.5" fill="#E2E8F0">• MV3 Chrome Extension ZIP</text>
  <text x="952" y="302" font-family="system-ui, sans-serif" font-size="12.5" fill="#E2E8F0">• Print PDF / Plain-Text</text>
  <text x="952" y="340" font-family="monospace" font-size="11" fill="#93C5FD">/api/extension/download</text>
</svg>
